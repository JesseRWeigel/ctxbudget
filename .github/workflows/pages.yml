name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never `group: pages`. One wedged run holds that shared lock and every later deploy queues
# behind it, and a wedged run cannot always be cancelled.
concurrency:
  group: pages-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify before publishing
        run: bash scripts/verify.sh
      # enablement: true turns Pages on for the repository if it is off. Without it the job
      # fails with "Get Pages site failed", which is what happened on the first three pushes
      # here: the workflow was committed but Pages had never been enabled in settings, so the
      # page was never published and only the run log said so.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
